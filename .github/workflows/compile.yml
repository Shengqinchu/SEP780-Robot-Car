name: Compile Arduino baselines
on:
  push:
    paths:
      - 'firmware/**'
      - 'host/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'tests/**'
      - 'programs.json'
      - 'toolchain.lock.json'
      - '.gitattributes'
      - '.github/workflows/compile.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'host/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'tests/**'
      - 'programs.json'
      - 'toolchain.lock.json'
      - '.gitattributes'
      - '.github/workflows/compile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - name: Check source snapshot and project structure
        run: ./tests/Check-Repository.ps1
      - name: Install pinned Arduino toolchain
        run: ./scripts/Setup-Toolchain.ps1
      - name: Install isolated host tools
        run: ./scripts/Setup-Host.ps1
      - name: Test host API without hardware
        run: ./tests/Test-Host.ps1
      - name: Host-only pySerial loopback
        run: ./scripts/Serial.ps1 -Action self-test
      - name: Compile every official sketch and USB check
        run: ./scripts/Build.ps1 -All
